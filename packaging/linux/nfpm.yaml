# The utter .deb and .rpm, built by scripts/package-linux.sh with nfpm from a
# release executable, in a directory it stages with utter, app.utter.desktop,
# the hicolor icons, utter.service, LICENSE, and the postinst/postrm scripts. They install what the AUR package utter-bin does:
# /usr/bin/utter, the desktop entry, and the systemd user unit. Utter never
# replaces a package-managed executable; it shows the update command the
# release service lists for the deb-<arch> or rpm-<arch> distribution.
name: utter
arch: ${UTTER_PACKAGE_ARCH}
platform: linux
version: ${UTTER_PACKAGE_VERSION}
version_schema: none
release: "1"
section: utils
priority: optional
maintainer: Utter <hello@utter.example>
vendor: Utter
homepage: https://utter.example
license: MIT
description: |-
  Utter voice dictation: hold a key, speak, and it types.
  Local speech recognition with optional voice commands (Linux beta).
contents:
  - src: utter
    dst: /usr/bin/utter
    file_info:
      mode: 0755
  - src: app.utter.desktop
    dst: /usr/share/applications/app.utter.desktop
    file_info:
      mode: 0644
  - src: icons/hicolor/16x16/apps/app.utter.png
    dst: /usr/share/icons/hicolor/16x16/apps/app.utter.png
    file_info:
      mode: 0644
  - src: icons/hicolor/24x24/apps/app.utter.png
    dst: /usr/share/icons/hicolor/24x24/apps/app.utter.png
    file_info:
      mode: 0644
  - src: icons/hicolor/32x32/apps/app.utter.png
    dst: /usr/share/icons/hicolor/32x32/apps/app.utter.png
    file_info:
      mode: 0644
  - src: icons/hicolor/48x48/apps/app.utter.png
    dst: /usr/share/icons/hicolor/48x48/apps/app.utter.png
    file_info:
      mode: 0644
  - src: icons/hicolor/64x64/apps/app.utter.png
    dst: /usr/share/icons/hicolor/64x64/apps/app.utter.png
    file_info:
      mode: 0644
  - src: icons/hicolor/128x128/apps/app.utter.png
    dst: /usr/share/icons/hicolor/128x128/apps/app.utter.png
    file_info:
      mode: 0644
  - src: icons/hicolor/256x256/apps/app.utter.png
    dst: /usr/share/icons/hicolor/256x256/apps/app.utter.png
    file_info:
      mode: 0644
  - src: icons/hicolor/512x512/apps/app.utter.png
    dst: /usr/share/icons/hicolor/512x512/apps/app.utter.png
    file_info:
      mode: 0644
  - src: utter.service
    dst: /usr/lib/systemd/user/utter.service
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/licenses/utter/LICENSE
    file_info:
      mode: 0644
scripts:
  postinstall: refresh-desktop.sh
  postremove: refresh-desktop.sh
overrides:
  # Linked, then loaded at runtime: the X11, Wayland, and xkbcommon client
  # libraries. The floor is Debian 12's glibc 2.36 and GCC 12 libstdc++
  # (packaging/linux/build.Dockerfile). Ubuntu 24.04 renamed alsa and
  # OpenSSL for its 64-bit time_t transition, so each takes either name.
  deb:
    depends:
      - libc6 (>= 2.36)
      - libgcc-s1
      - libstdc++6 (>= 12)
      - libasound2t64 | libasound2
      - libssl3t64 | libssl3
      - libvulkan1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libx11-6
      - libxcb1
      - libxcursor1
      - libxi6
      - libwayland-client0
      - curl
    recommends:
      - mesa-vulkan-drivers
      - wl-clipboard
      - wtype
      - xdg-utils
  # Library names, so Fedora and openSUSE resolve them to their own packages.
  rpm:
    depends:
      - libasound.so.2()(64bit)
      - libssl.so.3()(64bit)
      - libvulkan.so.1()(64bit)
      - libxkbcommon.so.0()(64bit)
      - libxkbcommon-x11.so.0()(64bit)
      - libX11.so.6()(64bit)
      - libxcb.so.1()(64bit)
      - libXcursor.so.1()(64bit)
      - libXi.so.6()(64bit)
      - libwayland-client.so.0()(64bit)
      - curl
    recommends:
      - wl-clipboard
      - wtype
      - xdg-utils
rpm:
  group: Applications/Productivity
  summary: Utter voice dictation by Utter
