name: UtterMobile
options:
  minimumXcodeGenVersion: 2.46.0
  bundleIdPrefix: app.utter
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "2660"
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.15.5
settings:
  base:
    DEVELOPMENT_TEAM: QC99C9JE59
    SWIFT_VERSION: 6.0
targets:
  UtterMobile:
    type: application
    platform: iOS
    sources:
      - UtterMobile
      - UtterShared
      - UtterActivity
      - path: ../app/AppIcon.icon
        buildPhase: resources
    dependencies:
      - package: FluidAudio
      - target: UtterKeyboard
        embed: true
      - target: UtterWidgets
        embed: true
    info:
      path: UtterMobile/Info.plist
      properties:
        CFBundleDisplayName: Utter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: app.utter.mobile.keyboard-session
            CFBundleURLSchemes:
              - utter-dictation
        NSMicrophoneUsageDescription: Utter records only while you dictate and transcribes locally on this iPhone.
        NSSpeechRecognitionUsageDescription: Utter uses Apple's on-device SpeechTranscriber to turn your recording into text.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - audio
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        ASSETCATALOG_COMPILER_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: UtterMobile/UtterMobile.entitlements
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.2.0
        OTHER_LDFLAGS: $(inherited) -weak_framework FoundationModels
        OTHER_SWIFT_FLAGS: $(inherited) -Xfrontend -disable-autolink-framework -Xfrontend FoundationModels
        PRODUCT_BUNDLE_IDENTIFIER: app.utter.mobile
        PRODUCT_NAME: HEX
    scheme:
      gatherCoverageData: false
      testTargets:
        - UtterMobileTests
  UtterKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - UtterKeyboard
      - UtterShared
    info:
      path: UtterKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Utter Keyboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: UtterKeyboard/UtterKeyboard.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.2.0
        PRODUCT_BUNDLE_IDENTIFIER: app.utter.mobile.keyboard
        PRODUCT_NAME: UtterKeyboard
        SKIP_INSTALL: YES
  UtterWidgets:
    type: app-extension
    platform: iOS
    sources:
      - UtterWidgets
      - UtterActivity
      - UtterShared/UtterTheme.swift
    info:
      path: UtterWidgets/Info.plist
      properties:
        CFBundleDisplayName: Utter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.2.0
        PRODUCT_BUNDLE_IDENTIFIER: app.utter.mobile.widgets
        PRODUCT_NAME: UtterWidgets
        SKIP_INSTALL: YES
  UtterMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - UtterMobileTests
      - path: ../tests/fixtures/vocabulary/audio/term-utter-1.wav
        buildPhase: resources
    dependencies:
      - target: UtterMobile
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.utter.mobile.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/HEX.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/HEX
